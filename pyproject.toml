[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin2eaf"
version = "1.1.0"
description = "Convert legacy exteraGram .plugin packages to Elyx .eaf archives"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
plugin2eaf = "plugin2eaf.cli:main"

[tool.setuptools]
packages = ["plugin2eaf"]
